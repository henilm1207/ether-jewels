services:
  mongo:
    # Pinned to mongo:7, NOT production's 8.0.32: this compose file's
    # `mongo-data` volume was initialized by a mongo:7 container, and MongoDB
    # refuses to start a newer major version against older on-disk data
    # (needs the official step-by-step major-version upgrade procedure first,
    # not just an image bump) — bumping this tag alone crash-loops the
    # container. See docker-compose.prod.yml for the real 8.x pin.
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-etherapp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Picks up JWT_SECRET, payment/mail/AI keys, etc. from server/.env,
    # matching docker-compose.prod.yml — keeps one source of secrets instead
    # of duplicating them across a root .env too. The overrides below wire
    # the app to the `mongo` service and the container's uploads volume —
    # they take precedence over the same keys in server/.env.
    env_file:
      - server/.env
      - .env
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-etherapp}:${MONGO_ROOT_PASSWORD}@mongo:27017/etherstar-jewels?authSource=admin
      UPLOADS_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5001}
      # Local stack is plain HTTP (reachable on the LAN by IP); drops the CSP
      # upgrade-insecure-requests directive so other devices can load assets.
      ALLOW_INSECURE_HTTP: "true"
    ports:
      - "${APP_PORT:-5001}:5001"
    volumes:
      - uploads-data:/app/uploads

volumes:
  mongo-data:
  uploads-data:
