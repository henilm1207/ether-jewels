name: Deploy prod

# Auto-deploy: any push to main (i.e. merged PR dev -> main) deploys to
# https://etherstarjewels.cloud/ via SSH as site user `etherstar`.
# Docker edition: build + run via docker-compose.prod.yml on the VPS
# (pull -> docker compose build app -> up -d -> health-check flow).
on:
  push:
    branches: [main]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Docker build (npm ci x2 + vite build + image layers) is slower than the
    # old bare pm2 restart — give it more headroom than the old 15m.
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Generous dial timeout: GitHub runner -> VPS handshake can stall
          # (one transient i/o timeout seen); the deploy itself is guarded by
          # the job timeout plus the script's own health-check polling.
          timeout: 90s
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            # Bootstrap the pull here (not only inside the script) so the
            # maiden deploy works before scripts/deploy-prod.sh exists on
            # the VPS, and every run executes the NEWEST script version.
            # PREV_SHA gives the script its rollback target.
            export PREV_SHA="$(git rev-parse HEAD)"
            git fetch origin
            git checkout main
            git reset --hard origin/main
            bash scripts/deploy-prod.sh
