# Nginx site for the mongo-express dashboard: https://db.etherstarjewels.cloud
# Deploy (VPS, as root):
#   cp ops/mongo-express/nginx-db.conf /etc/nginx/sites-available/db.etherstarjewels.cloud
#   ln -s /etc/nginx/sites-available/db.etherstarjewels.cloud /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d db.etherstarjewels.cloud   # adds the TLS blocks (managed by Certbot)
#
# Security layers: TLS (certbot) + mongo-express Basic Auth (its own env) +
# optional IP pinning below (uncomment + set your static IP for a 3rd layer).
server {
  listen 80;
  server_name db.etherstarjewels.cloud;

  # Optional IP lockdown (default OFF — enable if you have a static IP):
  # allow 203.0.113.10;
  # deny all;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # mongo-express has no websocket traffic; long poll not needed.
    # Tighten body size — the dashboard renders docs, it never uploads files.
    client_max_body_size 2m;
  }

  # Never cache an authenticated admin UI at shared caches.
  add_header Cache-Control "no-store" always;
}
