# Nginx site for the mongo-express dashboard: https://db.etherstarjewels.cloud
# Deploy (VPS, as root) — NOTE the .conf suffix is REQUIRED: nginx.conf
# includes sites-enabled/*.conf, so an extensionless filename is silently ignored:
#   cp ops/mongo-express/nginx-db.etherstarjewels.cloud.conf /etc/nginx/sites-available/db.etherstarjewels.cloud.conf
#   ln -s /etc/nginx/sites-available/db.etherstarjewels.cloud.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# TLS: provisioned with `certbot certonly --webroot` + manual wiring below
# (the --nginx plugin cannot parse this box's pre-existing default.conf).
# Renewal is automatic via certbot's systemd timer; this file references the
# live symlinks so renewals apply on plain `nginx -s reload`.
#
# Security layers: TLS + mongo-express Basic Auth (its own env) +
# optional IP pinning below (uncomment + set your static IP for a 3rd layer).
server {
  listen 80;
  server_name db.etherstarjewels.cloud;

  # ACME challenges must be served locally, not proxied to mongo-express.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name db.etherstarjewels.cloud;

  ssl_certificate /etc/letsencrypt/live/db.etherstarjewels.cloud/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/db.etherstarjewels.cloud/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # Optional IP lockdown (default OFF — enable if you have a static IP):
  # allow 203.0.113.10;
  # deny all;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # mongo-express has no websocket traffic; long poll not needed.
    # Tighten body size — the dashboard renders docs, it never uploads files.
    client_max_body_size 2m;
  }

  # Never cache an authenticated admin UI at shared caches.
  add_header Cache-Control "no-store" always;
}
